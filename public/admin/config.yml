# Decap CMS config. Docs: https://decapcms.org/docs/configuration-options/
#
# The admin saves straight to the site's own server, no GitHub: /admin/api is
# decap-server (in git mode, so every save is a commit and can be undone)
# behind a password that Caddy asks for; each commit rebuilds the site in a
# few seconds. Setup: deploy/cms/. On localhost the local_backend below is used.
backend:
  name: proxy
  proxy_url: /admin/api/v1
  branch: master

site_url: https://kluch.194-226-123-13.sslip.io
display_url: https://kluch.194-226-123-13.sslip.io
locale: ru

# On localhost: `npm run cms:server` (decap-server on :8081) edits the files
# in this folder directly.
local_backend: true

media_folder: public/uploads
public_folder: /uploads

# the preview pane showed raw unstyled data, not the site: off
editor:
  preview: false

collections:
  - name: afisha
    label: Афиша (расписание)
    files:
      - name: afisha
        label: Показы
        file: src/content/afisha.json
        fields:
          - label: Показы
            name: items
            label_singular: показ
            widget: list
            summary: "{{fields.date | date('DD.MM.YYYY')}} · {{fields.time}} — {{fields.title}}"
            hint: 'Афиша заполняется с Билетона автоматически, каждый час: новые сеансы, переносы и отмены появляются здесь сами. Вручную ничего не добавляйте — будущие даты, которых нет на Билетоне, сайт уберёт. Чтобы спектакль попал в афишу, впишите ссылку на его виджет в «Репертуаре»'
            fields:
              - { label: Дата, name: date, widget: date, format: 'YYYY-MM-DD', hint: 'День недели сайт определит сам по этой дате' }
              - { label: Название спектакля, name: title, widget: string }
              - { label: Возрастная маркировка, name: age, widget: string, required: false, hint: 'Например 16+' }
              - { label: Зал, name: hall, widget: string, required: false }
              - { label: Время, name: time, widget: string, hint: 'Например 18:00' }
              - { label: Ссылка на покупку этого сеанса, name: ticketUrl, widget: string, required: false, pattern: ['^$|^https://', 'Ссылка должна начинаться с https://'], hint: 'Страница именно этой даты на Билетоне (например https://bileton.ru/events/spektakl-simon-272476). Если пусто — кнопка «Купить» ведёт на страницу спектакля, а если нет и её — на витрину театра' }
              - label: Цвет строки
                name: band
                widget: select
                options:
                  - { label: Светлая (обычная), value: paper }
                  - { label: Красная (выделить), value: red }
                  - { label: Синяя (выделить), value: blue }

  - name: shows
    label: Репертуар
    files:
      - name: shows
        label: Спектакли
        file: src/content/shows.json
        fields:
          - label: Спектакли
            name: shows
            label_singular: спектакль
            widget: list
            summary: '{{title}}'
            fields:
              - { label: Название, name: title, widget: string }
              - { label: Возрастная маркировка, name: age, widget: string, required: false, hint: 'Например 16+. Если пусто — на сайте не показывается' }
              - { label: Жанр, name: genre, widget: string, required: false, hint: 'Например: мистическая комедия' }
              - { label: По мотивам / подзаголовок, name: based, widget: string, required: false }
              - { label: Описание, name: synopsis, widget: text, required: false }
              - { label: Режиссёр, name: dir, widget: string, required: false }
              - { label: Длительность, name: dur, widget: string, required: false, hint: 'Например 1 ч 40 мин' }
              - { label: Цена билета, name: price, widget: string, required: false, hint: 'Например: 1 300 ₽, группам от 15 человек — 1 200 ₽' }
              - { label: Фото со спектакля, name: photo, widget: image, required: false, hint: 'Если пусто — покажем фирменную заглушку' }
              - { label: Афиша (постер), name: poster, widget: image, required: false, hint: 'Печатная афиша спектакля целиком, вертикальная. Показывается на странице спектакля рядом с описанием' }
              - label: Цвет поверх фото
                name: tint
                widget: select
                required: false
                default: ''
                hint: 'Фото в карточках спектакля можно «напечатать» в два цвета в стиле афиши. По умолчанию — живые цвета фото'
                options:
                  - { label: Без цвета (живое фото), value: '' }
                  - { label: Красный, value: red }
                  - { label: Жёлтый, value: yellow }
                  - { label: Синий, value: blue }
                  - { label: Чёрно-белый, value: ink }
              - { label: Виджет Билетона (ссылка на билеты), name: ticketUrl, widget: string, required: false, pattern: ['^$|^https?://', 'Начните со https://'], hint: 'Необязательно. Даты сайт сам берёт с Билетона, а новый спектакль, заведённый там, появляется здесь сам. Сюда можно вписать виджет именно этого спектакля (например https://bileton.ru/widget/teatr_kluch_Simon) — тогда «Купить» на его странице откроет только его сеансы' }
              - label: Фото спектакля
                name: photos
                widget: list
                required: false
                hint: 'Несколько фото со сцены для страницы спектакля. Если пусто — блок не показывается'
                field: { label: Фото, name: photo, widget: image }
              - label: В ролях
                name: cast
                label_singular: актёра
                widget: list
                required: false
                summary: '{{fields.name}}'
                hint: 'Кто играет. Если пусто — блок «В ролях» не показывается'
                fields:
                  - { label: Имя, name: name, widget: string }
                  - { label: Роль, name: role, widget: string, required: false }
                  - { label: Фото (лицо крупно), name: photo, widget: image, required: false }
              - label: Цвет карточки
                name: bg
                widget: select
                options:
                  - { label: Красный, value: red }
                  - { label: Жёлтый, value: yellow }
                  - { label: Синий, value: blue }
                  - { label: Чёрный, value: ink }

  - name: courses
    label: Курсы
    files:
      - name: courses
        label: Список курсов
        file: src/content/courses.json
        fields:
          - label: Курсы
            name: items
            label_singular: курс
            widget: list
            summary: '{{name}} ({{ageRange}})'
            fields:
              - { label: Ключ (латиницей, без пробелов), name: key, widget: string, hint: 'Не менять для существующих курсов -- на него ссылаются группы' }
              - { label: Название, name: name, widget: string }
              - { label: Возраст, name: ageRange, widget: string }
              - label: Цвет карточки
                name: bg
                widget: select
                options:
                  - { label: Красный, value: red }
                  - { label: Жёлтый, value: yellow }
                  - { label: Синий, value: blue }
                  - { label: Чёрный, value: ink }
              - { label: Описание, name: desc, widget: text }
              - { label: Цена, name: price, widget: string }
              - { label: Расписание, name: schedule, widget: string, required: false, hint: 'Дни, время и месяцы, например: пн и ср, 18:00–19:00 · с сентября по июнь' }
              - { label: Старт группы, name: start, widget: string }
              - { label: Детский курс, name: isChild, widget: boolean }

  - name: courseGroups
    label: Группы курсов (карточки на странице «Курсы»)
    files:
      - name: courseGroups
        label: Группы
        file: src/content/courseGroups.json
        fields:
          - label: Группы
            name: items
            label_singular: группу
            widget: list
            summary: '{{title}}'
            fields:
              - { label: Ключ (латиницей, без пробелов), name: key, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Возраст, name: ageRange, widget: string }
              - { label: Краткое описание, name: shortDesc, widget: text }
              - label: Цвет карточки
                name: bg
                widget: select
                options:
                  - { label: Красный, value: red }
                  - { label: Жёлтый, value: yellow }
                  - { label: Синий, value: blue }
                  - { label: Чёрный, value: ink }
              - { label: Ключи курсов из раздела «Курсы» (через запятую), name: courseKeys, widget: list }
              - label: Фото группы (если пусто — блок галереи на странице не показывается)
                name: photos
                widget: list
                required: false
                field: { label: Фото, name: photo, widget: image }

  - name: directions
    label: Направления (запись и заявки)
    files:
      - name: directions
        label: Все направления
        file: src/content/directions.json
        fields:
          - label: Направления
            name: items
            label_singular: направление
            widget: list
            summary: '{{title}}'
            hint: 'Всё, на что можно оставить заявку, кроме курсов: подготовительные группы, фестиваль, квесты, карнавальные ночи, рассылка. Бот и сайт читают этот список.'
            fields:
              - { label: Код (латиницей, не менять), name: id, widget: string, hint: 'Например quest-2027. Нужен боту, чтобы отличать направления' }
              - label: Вид
                name: type
                widget: select
                options:
                  - { label: Подготовительная группа, value: prep }
                  - { label: Фестиваль, value: festival }
                  - { label: Квест, value: quest }
                  - { label: Карнавальная ночь, value: carnival }
                  - { label: Лаборатория, value: lab }
                  - { label: Лагерь, value: camp }
                  - { label: Рассылка, value: newsletter }
                  - { label: Другое, value: other }
              - { label: Название, name: title, widget: string }
              - { label: Описание, name: desc, widget: text, required: false }
              - { label: Возраст, name: age, widget: string, required: false, hint: 'Например 5–7 лет' }
              - { label: Расписание или даты (словами), name: schedule, widget: string, required: false }
              - label: Цены
                name: prices
                label_singular: цену
                widget: list
                required: false
                summary: '{{name}}: {{price}}'
                fields:
                  - { label: Вариант, name: name, widget: string, hint: 'Например: один, командой' }
                  - { label: Цена, name: price, widget: string, hint: 'Например: 1 500 ₽' }
              - { label: Показывать с, name: showFrom, widget: date, format: 'YYYY-MM-DD', required: false, hint: 'Пусто, если показывать всегда. Квесты и карнавальные ночи сами появятся и пропадут по датам' }
              - { label: Показывать по, name: showTo, widget: date, format: 'YYYY-MM-DD', required: false }
              - { label: Приём заявок открыт, name: open, widget: boolean, default: true, hint: 'Главный переключатель сезона. Выключено — на сайте пропадают кнопки и формы записи, плашка фестиваля на главной, а бот говорит, что запись закрыта. Страница мероприятия остаётся' }
              - { label: Спрашивать телефон, name: askPhone, widget: boolean, default: true }
              - label: Вопросы анкеты
                name: fields
                widget: list
                required: false
                summary: '{{label}}'
                hint: 'Что бот спросит у человека после имени (телефон спросит сам, если включено выше)'
                fields:
                  - { label: Название поля (попадёт в заявку), name: label, widget: string }
                  - label: Тип ответа
                    name: kind
                    widget: select
                    options:
                      - { label: Текст, value: text }
                      - { label: Число, value: number }
                      - { label: Электронная почта, value: email }
                      - { label: Выбор из вариантов, value: choice }
                  - { label: Варианты для выбора, name: options, widget: list, required: false, field: { label: Вариант, name: option, widget: string }, hint: 'Только для типа «Выбор из вариантов»' }
                  - { label: Как спросить, name: ask, widget: string, required: false, hint: 'Например: Из какого вы города?' }
              - { label: Адрес страницы на сайте, name: slug, widget: string, required: false, pattern: ['^$|^[a-z0-9-]+$', 'Только латиница, цифры и дефис, например kvest'], hint: 'Например kvest — страница будет на сайте по адресу /kvest. Пусто — своей страницы нет. Не меняйте у существующих: на них ведут ссылки' }
              - label: Страница на сайте
                name: page
                widget: object
                required: false
                collapsed: true
                hint: 'Что написано на странице мероприятия. Пустые блоки на сайте не показываются'
                fields:
                  - { label: Строка над названием, name: kicker, widget: string, required: false, hint: 'Например: Летний театральный лагерь' }
                  - label: Цвет первого экрана
                    name: tone
                    widget: select
                    default: red
                    options:
                      - { label: Красный, value: red }
                      - { label: Жёлтый, value: yellow }
                      - { label: Синий, value: blue }
                      - { label: Чёрный, value: ink }
                  - { label: Главное фото, name: photo, widget: image, required: false, hint: 'Горизонтальное. Если пусто — будет рисунок тушью' }
                  - label: Афиши (постеры)
                    name: posters
                    widget: list
                    required: false
                    hint: 'Печатные афиши целиком, вертикальные. Показываются рядом с описанием, по нажатию открываются крупно'
                    field: { label: Афиша, name: poster, widget: image }
                  - { label: Текст о мероприятии, name: intro, widget: text, required: false, hint: 'Каждый абзац с новой строки' }
                  - label: Цифры сбоку
                    name: facts
                    widget: list
                    required: false
                    summary: '{{fields.big}} — {{fields.note}}'
                    fields:
                      - { label: Число, name: big, widget: string, hint: 'Например: 2012, 3 дня' }
                      - { label: Подпись, name: note, widget: string, hint: 'Например: первая лаборатория' }
                  - label: Как записаться (шаги)
                    name: steps
                    widget: list
                    required: false
                    summary: '{{fields.title}}'
                    hint: 'Показываются, только когда приём заявок открыт'
                    fields:
                      - { label: Шаг, name: title, widget: string }
                      - { label: Пояснение, name: text, widget: string, required: false }
                  - label: Программа по дням
                    name: program
                    widget: list
                    required: false
                    summary: '{{fields.day}}'
                    fields:
                      - { label: День, name: day, widget: string, hint: 'Например: 18 декабря' }
                      - { label: Пункты, name: items, widget: list, field: { label: Пункт, name: item, widget: string } }
                  - label: Вопросы и ответы
                    name: faq
                    widget: list
                    required: false
                    summary: '{{fields.q}}'
                    fields:
                      - { label: Вопрос, name: q, widget: string }
                      - { label: Ответ, name: a, widget: text }
                  - label: Фото
                    name: photos
                    widget: list
                    required: false
                    hint: 'Показываются, если фото хотя бы три'
                    field: { label: Фото, name: photo, widget: image }

  - name: team
    label: Команда
    files:
      - name: team
        label: Состав
        file: src/content/team.json
        fields:
          - label: Люди
            name: members
            label_singular: человека
            widget: list
            summary: '{{name}} — {{role}}'
            fields:
              - { label: Имя, name: name, widget: string }
              - { label: Роль, name: role, widget: string }
              - { label: Фото, name: photo, widget: image, required: false }
              - label: Цвет карточки
                name: bg
                widget: select
                options:
                  - { label: Красный, value: red }
                  - { label: Жёлтый, value: yellow }
                  - { label: Синий, value: blue }
                  - { label: Чёрный, value: ink }
              - { label: Художественный руководитель (выделяется на странице), name: lead, widget: boolean, required: false, default: false }
              - { label: Девиз, name: quote, widget: string, required: false, hint: 'Любимая фраза человека, в кавычках. Показывается под именем, когда на сайте нажимают на карточку' }
              - { label: О человеке, name: bio, widget: text, required: false, hint: 'Показывается, когда на сайте нажимают на карточку. Каждый факт с новой строки: образование, что делает в театре, награды. Несколько строк станут списком, одна строка будет абзацем' }
              - { label: Спектакли, name: shows, widget: list, required: false, field: { label: Спектакль, name: show, widget: string }, hint: 'Необязательно: спектакли, где человек указан в «В ролях», добавятся сами. Здесь — прошлые постановки или то, чего нет в репертуаре' }
              - { label: Подпись на главной, name: homeCaption, widget: string, required: false, hint: 'Заполнено — человек показывается в блоке «Люди театра» на главной (первые четыре по порядку списка). Например: главный администратор' }
              - { label: Подпись в «Педагогах» на странице курсов, name: teacherCaption, widget: string, required: false, hint: 'Заполнено — человек показывается среди педагогов. Например: режиссёр-педагог' }
              - { label: Где лицо на фото (x% y%), name: focus, widget: string, required: false, hint: '50% 50% — центр, 50% 20% — выше. Если пусто — 50% 30%' }
              - { label: Увеличение фото, name: zoom, widget: number, value_type: float, min: 1, max: 3, step: 0.05, required: false, hint: '1 — без увеличения, 1.5 — крупнее. Если лицо мелкое на фото' }

  - name: gallery
    label: Галерея
    files:
      - name: gallery
        label: Фото
        file: src/content/gallery.json
        fields:
          - label: Фотографии
            name: images
            label_singular: фото
            widget: list
            summary: '{{src}}'
            fields:
              - { label: Фото, name: src, widget: image }
              - label: Размер плитки
                name: span
                widget: select
                options:
                  - { label: Обычное, value: normal }
                  - { label: Широкое (на две колонки), value: wide }
                default: normal

  - name: bot
    label: Ответы бота
    files:
      - name: bot
        label: Что знает кот в чате
        file: src/content/bot.json
        fields:
          - label: Разделы
            name: sections
            label_singular: раздел
            widget: list
            summary: '{{fields.title}}'
            hint: 'Бот отвечает только по тому, что здесь и в других разделах админки (афиша, спектакли, курсы, фестиваль). Цены курсов, афишу, фестиваль, команду, адрес, телефоны, почту, соцсети и где продаются билеты сюда не пишите — бот берёт их оттуда (контакты — в «Настройках сайта»). Изменения доходят до бота минут через 10–15 после сохранения.'
            fields:
              - { label: Служебная метка, name: id, widget: hidden, required: false }
              - { label: Заголовок, name: title, widget: string, hint: 'Например: Билеты, Парковка' }
              - { label: Текст, name: text, widget: text, hint: 'Коротко, по пункту на строку, каждый пункт с «- ». Только то, что театр готов подтвердить: бот повторит это людям как факт' }
          - label: Пока не подтверждено (бот отправляет к администратору)
            name: unconfirmed
            widget: list
            required: false
            hint: 'Темы, на которые бот сам не отвечает, а говорит «уточнит администратор». Когда ответ появится — впишите его в раздел выше и уберите тему отсюда'
            field: { label: Тема, name: item, widget: string }

  - name: settings
    label: Настройки сайта
    files:
      - name: settings
        label: Общие настройки
        file: src/content/settings.json
        fields:
          - { label: Ссылка на страницу театра на Билетоне, name: ticketsWidgetUrl, widget: string, required: false, pattern: ['^$|^https?://', 'Ссылка должна начинаться с https://'], hint: 'Общий виджет театра, например https://bileton.ru/widget/teatr_kluch. Отсюда сайт каждый час сам берёт все даты в афишу, а новый спектакль, заведённый на Билетоне как «Спектакль «…»», сам появляется в «Репертуаре». Бот даёт эту ссылку на вопросы про билеты' }
          - { label: Телефон администратора, name: phone, widget: string, pattern: ['^\+?[0-9 ()-]{10,20}$', 'Например: +7 906 120-22-62'], hint: 'Главный номер: его показывает сайт и называет бот, когда отправляет к администратору' }
          - { label: Второй телефон, name: phone2, widget: string, required: false, pattern: ['^$|^\+?[0-9 ()-]{10,20}$', 'Например: +7 962 573-92-19'] }
          - { label: Когда звонить, name: hours, widget: string, hint: 'Например: пн–пт, 15:00–21:00. Бот говорит, что администратор перезвонит в это время' }
          - { label: Почта театра, name: email, widget: string, pattern: ['^[^@ ]+@[^@ ]+[.][^@ ]+$', 'Проверьте адрес почты'] }
          - { label: Где продаются билеты, name: ticketsWhere, widget: string, hint: 'Продолжение фразы «Билеты продаются …». Например: на Билетоне, Яндекс Афише и в кассе театра' }
          - { label: Адрес, name: address, widget: string, hint: 'Город, район, дом. Например: Набережные Челны, Новый город, 1/02. По нему строится ссылка на карту' }
          - { label: Где играем (площадка), name: venue, widget: string, hint: 'Например: Молодёжный центр «НУР»' }
          - { label: Как пройти, name: entrance, widget: string, required: false, hint: 'Например: второй вход. Если пусто — не показывается' }
          - { label: Точка на карте (широта, долгота), name: mapPoint, widget: string, pattern: ['^\s*-?\d+[.]\d+\s*,\s*-?\d+[.]\d+\s*$', 'Два числа через запятую, например: 55.741678, 52.424845'], hint: 'Центр карты в «Как нас найти». Менять, только если театр переехал: в 2ГИС нажать правой кнопкой на здание и скопировать координаты. Карта с карточкой театра берётся из ссылки на отзывы в Яндекс Картах, кнопки «Как добраться» — из ссылок на Яндекс Карты и 2ГИС' }
          - { label: ВКонтакте (ссылка), name: vk, widget: string, required: false, pattern: ['^$|^https://', 'Ссылка должна начинаться с https://'], hint: 'Если пусто — значок не показывается' }
          - { label: Отзывы в 2ГИС (ссылка), name: review2gis, widget: string, required: false, pattern: ['^$|^https://', 'Ссылка должна начинаться с https://'], hint: 'Страница театра в 2ГИС, вкладка «Отзывы». Если пусто — кнопки 2ГИС в блоке отзывов не будет' }
          - { label: Отзывы в Яндекс Картах (ссылка), name: reviewYandex, widget: string, required: false, pattern: ['^$|^https://', 'Ссылка должна начинаться с https://'], hint: 'Страница театра в Яндекс Картах, вкладка «Отзывы». Если обе ссылки пустые — блок отзывов не показывается' }
          - { label: Telegram-канал (ссылка), name: telegram, widget: string, required: false, pattern: ['^$|^https://', 'Ссылка должна начинаться с https://'], hint: 'Если пусто — значок не показывается' }
          - { label: Max (ссылка), name: max, widget: string, required: false, pattern: ['^$|^https://', 'Ссылка должна начинаться с https://'], hint: 'Канал или чат театра в Max. Пока пусто, значок виден серым и никуда не ведёт' }
          - { label: Instagram (ссылка), name: instagram, widget: string, required: false, pattern: ['^$|^https://', 'Ссылка должна начинаться с https://'], hint: 'Пока пусто, значок виден серым и никуда не ведёт' }
          - { label: Юридическое название, name: legalName, widget: string, required: false, hint: 'Как в уставе. Пишется в «Политике обработки персональных данных»' }
          - { label: ИНН, name: inn, widget: string, required: false, pattern: ['^$|^[0-9]{10}$', '10 цифр'], hint: 'Для «Политики обработки персональных данных». Если пусто — не показывается' }
          - { label: ОГРН, name: ogrn, widget: string, required: false, pattern: ['^$|^[0-9]{13}$', '13 цифр'], hint: 'Для «Политики обработки персональных данных». Если пусто — не показывается' }
          - { label: Ответственный за персональные данные, name: privacyOfficer, widget: string, required: false, hint: 'ФИО и должность, например: Иванова Мария Петровна, директор. Если пусто — в политике будет «руководитель организации»' }
          - { label: Адрес сайта, name: siteUrl, widget: string, required: false, pattern: ['^$|^https://[^/]+$', 'Только адрес, например https://kluchtheatre.ru, без / на конце'], hint: 'Домен сайта, например https://kluchtheatre.ru. Пока пусто — поисковики сайт не индексируют (так задумано для временного адреса). Впишите, как только сайт переедет на свой домен' }
          - { label: Код подтверждения Яндекс Вебмастера, name: yandexVerification, widget: string, required: false, hint: 'Из Вебмастера → «Права доступа» → способ «Мета-тег»: только значение content, например 1a2b3c4d5e6f7a8b' }
          - { label: Код подтверждения Google Search Console, name: googleVerification, widget: string, required: false, hint: 'Из Search Console → способ «Тег HTML»: только значение content' }
          - { label: Номер счётчика Яндекс Метрики, name: metrikaId, widget: string, required: false, pattern: ['^$|^[0-9]+$', 'Только цифры'], hint: 'Только цифры, например 98765432. Метрика считает посещения и помогает Яндексу понять, что сайт живой' }
      - name: home
        label: Главная страница
        file: src/content/home.json
        fields:
          - label: Первый экран
            name: hero
            widget: list
            summary: '{{fields.show}}'
            hint: 'Спектакли для большого слайдера наверху главной. Показываются только те, у которых есть ближайший показ в афише, по порядку дат. Спектакль без хорошего фото сюда лучше не добавлять.'
            fields:
              - { label: Спектакль (название как в афише), name: show, widget: string }
              - { label: Фото на весь экран, name: photo, widget: image, hint: 'Горизонтальное, крупное (от 2500 px по ширине), актёры на сцене. Слева на фото будет название, там лучше тёмный фон' }
              - { label: Главное на фото (x% y%), name: focus, widget: string, required: false, default: '60% 40%', hint: 'Какую точку фото держать в кадре. 50% 50% — центр, 70% 30% — правее и выше' }
      - name: festival
        label: Фестиваль «Действующие лица»
        file: src/content/festival.json
        fields:
          - label: О фестивале (абзацы)
            name: intro
            widget: list
            field: { label: Абзац, name: text, widget: text }
          - label: Цифры
            name: stats
            widget: list
            summary: '{{fields.big}} — {{fields.note}}'
            fields:
              - { label: Число, name: big, widget: string, hint: 'Например: 2004, 20+, 45' }
              - { label: Подпись, name: note, widget: string, hint: 'Например: первый фестиваль, городов России' }
          - label: Программа по дням
            name: program
            widget: list
            required: false
            summary: '{{fields.day}}'
            hint: 'Если пусто — блок «Программа» не показывается'
            fields:
              - { label: День, name: day, widget: string, hint: 'Например: 21 апреля' }
              - { label: Пункты, name: items, widget: list, field: { label: Пункт, name: item, widget: string } }
          - label: Вопросы и ответы
            name: faq
            widget: list
            required: false
            summary: '{{fields.q}}'
            hint: 'Если пусто — блок «Вопросы» не показывается'
            fields:
              - { label: Вопрос, name: q, widget: string }
              - { label: Ответ, name: a, widget: text }
          - label: Фото прошлых лет
            name: photos
            widget: list
            required: false
            hint: 'Показываются, если фото хотя бы три'
            field: { label: Фото, name: photo, widget: image }

  - name: awards
    label: Награды
    files:
      - name: awards
        label: Список наград
        file: src/content/awards.json
        fields:
          - label: Награды
            name: items
            widget: list
            field: { label: Награда, name: award, widget: string }

  - name: productions
    label: Все постановки (страница «О театре»)
    files:
      - name: productions
        label: Список постановок
        file: src/content/productions.json
        fields:
          - label: Постановки
            name: items
            widget: list
            summary: '{{year}} — {{title}}'
            fields:
              - { label: Год, name: year, widget: string }
              - { label: Название, name: title, widget: string, hint: 'Без кавычек — они добавятся сами' }
              - { label: По чему поставлен, name: note, widget: string, required: false, hint: 'Например: по повести А. Линдгрен или пьеса Я. Пулинович. Видно под названием мелким шрифтом' }
